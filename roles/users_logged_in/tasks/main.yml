- name: Check active interactive users
  ansible.windows.win_shell: |
    $sessions = @(quser.exe 2>$null)

    if ($LASTEXITCODE -ne 0 -or $sessions.Count -le 1) {
        Write-Output "NO_ACTIVE_USERS"
        exit 0
    }

    $activeUsers = @()

    foreach ($line in ($sessions | Select-Object -Skip 1)) {
        if ($line -match '\sActive\s') {
            $cleanLine = $line.Trim().TrimStart('>')
            $username = ($cleanLine -split '\s+')[0]

            if ($username) {
                $activeUsers += $username
            }
        }
    }

    $activeUsers = @($activeUsers | Sort-Object -Unique)

    if ($activeUsers.Count -eq 0) {
        Write-Output "NO_ACTIVE_USERS"
    }
    else {
        Write-Output "ACTIVE_USERS"

        foreach ($username in $activeUsers) {
            Write-Output $username
        }
    }
  register: login_status
  changed_when: false
  failed_when: false

- name: Display active logged-in users
  ansible.builtin.debug:
    var: login_status.stdout_lines

- name: Set fact if active users exist
  ansible.builtin.set_fact:
    users_logged_in: "{{ 'ACTIVE_USERS' in login_status.stdout_lines }}"
