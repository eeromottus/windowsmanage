---
- name: Check installed software - {{ software.name }}
  ansible.windows.win_powershell:
    script: |
      # Method 1: Detect version from executable
      {% if software.detect_file | default('') | length > 0 %}

      $path = "{{ software.detect_file }}"

      if (Test-Path $path) {
        (Get-Item $path).VersionInfo.ProductVersion
      }

      # Method 2: Detect AppX/MSIX package
      {% elif software.detect_appx | default('') | length > 0 %}

      $app = Get-AppxPackage -AllUsers -Name "{{ software.detect_appx }}" `
        -ErrorAction SilentlyContinue |
        Select-Object -First 1

      if ($app) {
        $app.Version.ToString()
      }

      # Method 3: Normal HKLM Uninstall registry detection
      {% else %}

      $app = Get-ItemProperty `
        "HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*",
        "HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*" `
        -ErrorAction SilentlyContinue |
        Where-Object { $_.DisplayName -like "{{ software.product }}" } |
        Select-Object -First 1

      if ($app) {
        $app.DisplayVersion
      }

      {% endif %}
  register: software_installed
  changed_when: false

- name: Set install requirement - {{ software.name }}
  ansible.builtin.set_fact:
    software_install: >-
      {{
        software_installed.output | length == 0 or
        (
          software.version is defined and
          software.version | length > 0 and
          not ((software_installed.output[0] | trim).startswith(software.version))
       )
      }}

- name: Create temp directory - {{ software.name }}
  ansible.windows.win_file:
    path: "{{ software_temp_root }}\\{{ software.name }}"
    state: directory
  when: 
    - software_install
    - software.source != "winget"

- name: Copy local installer - {{ software.name }}
  ansible.windows.win_copy:
    src: "{{ software.local_src }}"
    dest: "{{ software_temp_root }}\\{{ software.name }}\\{{ software.installer }}"
  when:
    - software_install
    - software.source | default('url') == 'local'

- name: Download installer - {{ software.name }}
  ansible.windows.win_get_url:
    url: "http://docker01/{{ software.name }}/{{ software.installer }}"
    dest: "{{ software_temp_root }}\\{{ software.name }}\\{{ software.installer }}"
  when:
    - software_install
    - software.source | default('url') == 'url'    

- name: Install package - {{ software.name }}
  ansible.windows.win_package:
    path: "{{ software_temp_root }}\\{{ software.name }}\\{{ software.installer }}"
    state: present
    arguments: "{{ software.arguments | default('/qn /norestart') }}"
  when: 
    - software_install
    - software.source != "winget"

- name: Install with winget - {{ software.name }}
  ansible.windows.win_shell: |
    winget install --id "{{ software.id }}" --exact `
      --accept-package-agreements `
      --accept-source-agreements `
      --disable-interactivity
  when:
    - software_install
    - software.source == "winget"

- name: Remove temp files - {{ software.name }}
  ansible.windows.win_file:
    path: "{{ software_temp_root }}\\{{ software.name }}"
    state: absent
  when: 
    - software_install
    - software.source != "winget"
