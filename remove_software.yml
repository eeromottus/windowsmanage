---
  tasks:
    - name: Check whether SSH port is reachable
      ansible.builtin.wait_for:
        host: "{{ ansible_host | default(inventory_hostname) }}"
        port: "{{ ansible_port | default(22) }}"
        timeout: 3
        connect_timeout: 2
        state: started
      delegate_to: localhost
      register: port_check
      failed_when: false
      changed_when: false

    - name: Add reachable computers to active_windows
      ansible.builtin.add_host:
        name: "{{ inventory_hostname }}"
        groups: active_windows
      when: port_check is succeeded

- name: Install common Windows software
  hosts: active_windows
  gather_facts: false

- name: Remove common Windows software
  hosts: active_windows
  gather_facts: false

  vars:
    software_remove:
      - "Adobe Acrobat (64-bit)"
      - "Zoom Workplace (32-bit)"
      - "PDF-XChange Editor"
      - "*OpenOffice*"
  tasks:
    - name: Remove software by display name
      ansible.windows.win_powershell:
        script: |
          $name = "{{ item }}"

          $apps = Get-ItemProperty `
            "HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*" ,
            "HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*" `
            -ErrorAction SilentlyContinue

          $apps |
            Where-Object { $_.DisplayName -like "*$name*" } |
            ForEach-Object {
              if ($_.PSChildName -match "^\{.*\}$") {
                Start-Process msiexec.exe `
                  -ArgumentList "/x $($_.PSChildName) /qn /norestart" `
                  -Wait
              }
            }
      loop: "{{ software_remove }}"
