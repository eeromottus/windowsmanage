---
- name: Detect online Windows computers quietly
  hosts: windows_mini
  gather_facts: false

  tasks:
    - name: Check whether SSH port is reachable
      ansible.builtin.wait_for:
        host: "{{ ansible_host | default(inventory_hostname) }}"
        port: "{{ ansible_port | default(22) }}"
        timeout: 3
        connect_timeout: 2
        state: started
      delegate_to: localhost
      register: port_check
      failed_when: false
      changed_when: false

    - name: Add reachable computers to active_windows
      ansible.builtin.add_host:
        name: "{{ inventory_hostname }}"
        groups: active_windows
      when: port_check is succeeded

- name: Install common Windows software
  hosts: active_windows
  gather_facts: false

  vars:
    software_packages:
      - name: LibreOffice
        version: "26.2.5.2"
        source: url
        url: "https://download.documentfoundation.org/libreoffice/stable/26.2.5/win/x86_64/LibreOffice_26.2.5_Win_x86-64.msi"
        installer: "LibreOffice.msi"
        product: "LibreOffice*"
        arguments: "/qn /norestart"

      - name: Google Chrome
        version: "150.0.7871"
        source: url
        id: Google.Chrome
        url: "https://dl.google.com/dl/chrome/install/googlechromestandaloneenterprise64.msi"
        installer: "GoogleChrome.msi"
        product: "Google Chrome*"
        arguments: "/qn /norestart"

      - name: 7-Zip
        version: "26.02"
        source: url
        id: 7zip.7zip
        url: "https://www.7-zip.org/a/7z2501-x64.msi"
        installer: "7zip.msi"
        product: "7-Zip*"
        arguments: "/qn /norestart"

      - name: SumatraPDF
        version: "3.6.1"
        source: url
        url: "https://www.sumatrapdfreader.org/dl/rel/3.6.1/SumatraPDF-3.6.1-64-install.exe"
        installer: "SumatraPDF-3.6.1-64-install.exe"
        local_src: ""
        product: "SumatraPDF"
        arguments: "-install -silent -all-users"
        
      - name: VLC media player
        version: "3.0.23"
        source: url
        url: "https://get.videolan.org/vlc/last/win64/vlc-3.0.23-win64.msi"
        installer: "vlc.msi"
        product: "VLC media player*"
        arguments: "/qn /norestart"

  roles:
    - software
    - rustdesk
    - idsoftware
